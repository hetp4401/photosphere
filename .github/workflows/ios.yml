# Builds PhotoSphere on a macOS runner: the self test in the iOS Simulator (a synthetic world photographed at the dots,
# stitched through the app's own pipeline, compared with the truth; screenshots of the live mosaic and the result), then
# an unsigned iPhone build as PhotoSphere.ipa, both published as the release "latest":
# https://github.com/hetp4401/photosphere/releases/download/latest/PhotoSphere.ipa (sideload it: AltStore, SideStore or
# Sideloadly sign it with your Apple ID).
name: ios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  BUNDLE: com.hetp4401.photosphere
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          brew install xcodegen > /tmp/brew.log 2>&1 || { tail -30 /tmp/brew.log; exit 1; }
          xcodebuild -version
      - name: project
        run: xcodegen generate
      - name: simulator build
        run: |
          xcodebuild -project PhotoSphere.xcodeproj -scheme PhotoSphere -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { grep -E "error:" sim.log | head -60; tail -60 sim.log; exit 1; }
          echo "warnings: $(grep -c 'warning:' sim.log || true)"
          grep -E "warning:.*(Swift|\.mm)" sim.log | sort -u | head -20 || true
      - name: self test in the simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rts = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for rt in reversed(rts):
              ph = [x for x in d[rt] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]] or [x for x in d[rt] if x["name"].startswith("iPhone")]
              if ph:
                  print(ph[0]["name"], file=sys.stderr); print(ph[0]["udid"]); break
          ')
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          APP=$(find build/sim/Build/Products -name "PhotoSphere.app" -maxdepth 2 | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          xcrun simctl launch "$DEV" "$BUNDLE" -selftest -mosaicseconds 14
          CONT=$(xcrun simctl get_app_container "$DEV" "$BUNDLE" data)
          echo "data container: $CONT"
          sleep 9; xcrun simctl io "$DEV" screenshot shots/1-mosaic.png
          for i in $(seq 1 200); do [ -f "$CONT/Documents/selftest.txt" ] && break; sleep 5; done
          if [ ! -f "$CONT/Documents/selftest.txt" ]; then
            echo "no verdict in time"; xcrun simctl io "$DEV" screenshot shots/2-timeout.png
            xcrun simctl spawn "$DEV" log show --last 15m --predicate 'process == "PhotoSphere"' --style compact 2>/dev/null | tail -60 || true
            exit 1
          fi
          cat "$CONT/Documents/selftest.txt" | tee shots/selftest.txt; echo
          sleep 8; xcrun simctl io "$DEV" screenshot shots/2-viewer.png
          cp "$CONT/Documents/Panoramas/"selftest-*.jpg shots/ || true
          cp "$CONT/tmp/selftest/room/truth.jpg" shots/truth-room.jpg || true
          grep -q "ALL PASS" shots/selftest.txt
      - name: real photos (the owner's room, from a private link)
        if: always()
        env:
          ROOM_URLS: ${{ secrets.ROOM_URLS }}
        run: |
          if [ -z "$ROOM_URLS" ] || [ -z "$DEV" ]; then echo "no photos or no simulator"; exit 0; fi
          mkdir -p room private
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i + 1))
            curl -sL -A "Mozilla/5.0" -o "room/$(printf %02d "$i").jpg" "$u"
          done <<< "$ROOM_URLS"
          echo "$(ls room | wc -l) photos"
          CONT=$(xcrun simctl get_app_container "$DEV" "$BUNDLE" data)
          mkdir -p "$CONT/tmp/room"
          cp room/*.jpg "$CONT/tmp/room/"
          xcrun simctl terminate "$DEV" "$BUNDLE" 2>/dev/null || true
          xcrun simctl launch "$DEV" "$BUNDLE" -stitchdir room -focalPx 1344 -out room -width 4096
          for k in $(seq 1 240); do [ -f "$CONT/Documents/room.txt" ] && break; sleep 5; done
          if [ ! -f "$CONT/Documents/room.txt" ]; then echo "no result in time"; xcrun simctl io "$DEV" screenshot private/room-timeout.png; exit 0; fi
          cat "$CONT/Documents/room.txt" | tee private/room.txt; echo
          sleep 6; xcrun simctl io "$DEV" screenshot private/room-viewer.png
          cp "$CONT/Documents/Panoramas/room.jpg" private/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-test
          path: private
          if-no-files-found: ignore
      - name: iPhone build (unsigned) and ipa
        if: always()
        run: |
          xcodebuild -project PhotoSphere.xcodeproj -scheme PhotoSphere -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > dev.log 2>&1 \
            || { grep -E "error:" dev.log | head -40; tail -40 dev.log; exit 1; }
          mkdir -p Payload
          cp -R build/dev/Build/Products/Release-iphoneos/PhotoSphere.app Payload/
          zip -qry PhotoSphere.ipa Payload
          ls -la PhotoSphere.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere
          path: |
            PhotoSphere.ipa
            shots/*
      - name: publish the release "latest"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f PhotoSphere.ipa ] || exit 0
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest PhotoSphere.ipa shots/* --target "${{ github.sha }}" --title "PhotoSphere (latest build)" \
            --notes "Unsigned build of ${{ github.sha }}. Sideload PhotoSphere.ipa with AltStore, SideStore or Sideloadly (they sign it with your Apple ID). The screenshots and selftest.txt are the build's own check: a synthetic world stitched through the app."

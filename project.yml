name: PhotoSphere
options:
  bundleIdPrefix: com.hetp4401
  deploymentTarget:
    iOS: "16.0"
packages:
  OpenCV:
    url: https://github.com/yeatse/opencv-spm
    from: 5.0.0
targets:
  PhotoSphere:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: OpenCV
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PhotoSphere
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: To take the photos that make up a sphere.
        NSMotionUsageDescription: To know where the camera points while you capture a sphere.
        NSPhotoLibraryAddUsageDescription: To save finished spheres to your photos.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hetp4401.photosphere
        PRODUCT_NAME: PhotoSphere
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Native/Bridging.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        ENABLE_BITCODE: NO
        ENABLE_PREVIEWS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
